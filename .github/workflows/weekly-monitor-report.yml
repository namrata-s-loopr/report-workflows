name: Weekly monitor report

on:
  schedule:
    # GitHub Actions evaluates cron in UTC: 04:30 UTC is 10:00 IST.
    - cron: "30 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Controls report labels and the weekly date boundary; it does not affect cron.
      REPORT_TIMEZONE: Asia/Kolkata
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and send weekly report
        run: |
          npm ci
          npm run send-report
